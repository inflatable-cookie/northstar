[manifest]
minimum_effigy_version = "0.13.0"

[catalog]
alias = "northstar"

[tasks]
"check:skill-install" = "python3 scripts/check-skill-install.py {args}"
"check:links" = "python3 skills/northstar/scripts/cut.py check-links {args}"
"check:changelog" = "python3 skills/northstar/scripts/changelog.py check {args}"
"test:cut" = "bash skills/northstar/scripts/cut.test.sh"
"test:changelog" = "bash skills/northstar/scripts/changelog.test.sh"
"changelog:fold" = "python3 skills/northstar/scripts/changelog.py fold {args}"
"qa:docs" = [{ task = "check:links" }, { task = "check:changelog" }]
qa = [{ task = "test:cut" }, { task = "test:changelog" }, { task = "qa:docs" }]
