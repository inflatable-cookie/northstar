[manifest]
minimum_effigy_version = "0.8.4"

[catalog]
alias = "northstar"

[bootstrap]
setup = ["health"]

[tasks]
"check:bundle" = [{ rhai = "scripts/check-northstar-bundle.rhai" }]
"check:repo-contract" = [{ rhai = "scripts/check-northstar-repo-contract.rhai" }]
"check:posture-advisory" = [{ rhai = "scripts/check-northstar-posture-advisory.rhai" }]
"check:skill-install" = [{ rhai = "scripts/check-northstar-skill-install.rhai" }]
"check:readiness-map" = [{ rhai = "scripts/check-northstar-readiness-map.rhai" }]
"check:agent-instructions" = [{ rhai = "skills/northstar/scripts/check-agent-instructions.rhai" }]
"check:rust-quality" = [{ rhai = "skills/northstar/scripts/check-rust-quality.rhai" }]
"check:typescript-quality" = [{ rhai = "skills/northstar/scripts/check-typescript-quality.rhai" }]
"typescript-quality:setup" = [{ rhai = "skills/northstar/scripts/typescript-quality-setup.rhai" }]
"typescript-quality:record" = [{ rhai = "skills/northstar/scripts/typescript-quality-recorder.rhai" }]
"test:typescript-quality-setup" = [{ task = "typescript-quality:setup self-test" }]
"test:typescript-quality-recorder" = [{ task = "typescript-quality:record self-test" }]
"paseo:worktree" = [{ rhai = "skills/northstar/scripts/paseo-worktree.rhai" }]
"test:paseo-worktree" = [{ task = "paseo:worktree self-test" }]
"rust-quality:setup" = [{ rhai = "skills/northstar/scripts/rust-quality-setup.rhai" }]
"test:rust-quality-setup" = [{ task = "rust-quality:setup self-test" }]
"test:rust-v2-production-harness" = "scripts/tests/rust-quality-production/self-test.sh"
"check:command-skills" = [{ rhai = "scripts/check-northstar-command-skills.rhai" }]
"test:readiness-map" = [{ rhai = "scripts/test-northstar-readiness-map.rhai" }]
"qa:docs" = [{ task = "check:repo-contract" }, { task = "check:readiness-map" }, { task = "test:readiness-map" }, { task = "check:command-skills" }]
health = [{ task = "check:bundle" }]
validate = [{ task = "check:bundle" }, { task = "check:rust-quality" }, { task = "check:typescript-quality" }, { task = "test:rust-quality-setup" }, { task = "test:rust-v2-production-harness" }, { task = "test:typescript-quality-setup" }, { task = "test:typescript-quality-recorder" }, { task = "test:paseo-worktree" }]
qa = [{ task = "validate" }, { task = "qa:docs" }]
