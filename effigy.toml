[manifest]
minimum_effigy_version = "0.8.4"

[catalog]
alias = "northstar"

[bootstrap]
setup = ["health"]

[tasks]
"check:bundle" = [{ rhai = "scripts/check-northstar-bundle.rhai" }]
"check:repo-contract" = [{ rhai = "scripts/check-northstar-repo-contract.rhai" }]
"check:repo-contract-wiring" = [{ rhai = "scripts/check-northstar-repo-contract-wiring.rhai" }]
"check:posture-advisory" = [{ rhai = "scripts/check-northstar-posture-advisory.rhai" }]
"check:skill-install" = [{ rhai = "scripts/check-northstar-skill-install.rhai" }]
"check:readiness-map" = [{ rhai = "scripts/check-northstar-readiness-map.rhai" }]
"check:agent-instructions" = [{ rhai = "skills/northstar/scripts/check-agent-instructions.rhai" }]
"check:language-packages" = [{ rhai = "skills/northstar/scripts/check-language-packages.rhai" }]
"check:language-package-routes" = "scripts/tests/language-package-routes/self-test.sh"
"check:chatterbox-git" = "scripts/tests/chatterbox-git-isolation/self-test.sh"
"paseo:worktree" = [{ rhai = "skills/northstar/scripts/paseo-worktree.rhai" }]
"test:paseo-worktree" = [{ task = "paseo:worktree self-test" }]
"check:command-skills" = [{ rhai = "scripts/check-northstar-command-skills.rhai" }]
"check:model-routing" = [{ rhai = "scripts/check-northstar-model-routing.rhai" }]
"test:readiness-map" = [{ rhai = "scripts/test-northstar-readiness-map.rhai" }]
"test:repo-contract" = [{ rhai = "scripts/test-northstar-repo-contract.rhai" }]
"qa:docs" = [{ task = "check:repo-contract-wiring" }, { task = "check:repo-contract" }, { task = "test:repo-contract" }, { task = "check:readiness-map" }, { task = "test:readiness-map" }, { task = "check:command-skills" }, { task = "check:model-routing" }, { task = "check:language-packages" }]
health = [{ task = "check:bundle" }]
validate = [{ task = "check:repo-contract-wiring" }, { task = "check:bundle" }, { task = "check:language-packages" }, { task = "check:language-package-routes" }, { task = "test:paseo-worktree" }]
qa = [{ task = "validate" }, { task = "qa:docs" }]
