[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "northstar"

[bootstrap]
setup = ["health"]

[tasks]
"check:bundle" = "bun run ./scripts/check-northstar-bundle.ts"
"check:repo-contract" = "bun run ./scripts/check-northstar-repo-contract.ts"
"qa:docs" = [{ task = "check:repo-contract" }]
health = [{ task = "check:bundle" }]
validate = [{ task = "check:bundle" }]
qa = [{ task = "validate" }, { task = "qa:docs" }]
