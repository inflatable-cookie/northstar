[manifest]
minimum_effigy_version = "0.13.0"

[catalog]
alias = "northstar"

[tasks]
"check:skill-install" = [{ rhai = "scripts/check-northstar-skill-install.rhai" }]
"check:retired-concepts" = "bun run skills/northstar/scripts/retired-concepts.ts {args}"
"check:links" = "python3 skills/northstar/scripts/cut.py check-links {args}"
"test:retired-concepts" = "bash skills/northstar/scripts/retired-concepts.test.sh"
"test:cut" = "bash skills/northstar/scripts/cut.test.sh"
"paseo:worktree" = [{ rhai = "skills/northstar/scripts/paseo-worktree.rhai" }]
"test:paseo-worktree" = [{ task = "paseo:worktree self-test" }]
"check:language-packages" = [{ rhai = "skills/northstar/scripts/check-language-packages.rhai" }]
"check:language-package-routes" = "scripts/tests/language-package-routes/self-test.sh"
# Reruns against live sibling consumers (jetstream, convergence); not part of qa.
"check:language-consumer-reruns" = "python3 scripts/tests/language-package-routes/validate_consumer_reruns.py"
"language:route" = "bun run skills/northstar/scripts/language-package-lifecycle.ts route {args}"
# Hook bridge for v1–v4 manifests. Remove with the bridge.
"lifecycle:run" = "bun run skills/northstar/scripts/lifecycle-core.ts {args}"
"check:lifecycle-core" = "scripts/tests/lifecycle-core/self-test.sh"
"qa:docs" = [{ task = "check:retired-concepts" }, { task = "check:links" }]
qa = [{ task = "test:retired-concepts" }, { task = "test:cut" }, { task = "test:paseo-worktree" }, { task = "check:language-packages" }, { task = "check:language-package-routes" }, { task = "check:lifecycle-core" }, { task = "qa:docs" }]
