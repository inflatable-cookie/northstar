activation:
  min_score: 0.74
  samples:
    - "Create a Northstar handoff for the next thread."
    - "Write a continuation brief for this roadmap batch."
    - "Turn this active roadmap/log state into a handoff prompt."
    - "Turn the current planning and log state into a continuation handoff."
    - "Write a handoff that keeps the thread context and intent, not just the task list."
    - "Create a handoff that preserves the active spec lane and canonical refs."
instructions:
  default_prompt: "Use $northstar-handoff only when a fresh-thread boundary is genuinely required, not merely because context is low or compaction is near. Produce a continuation brief that preserves thread intent, planning lineage, the active spec lane, and the canonical promoted refs for the next thread. For the handoff and its operator-facing message, use glue-light compressed writing: lead with why the handoff exists, the current lane state, and the next move; keep validation and protocol detail concise."
