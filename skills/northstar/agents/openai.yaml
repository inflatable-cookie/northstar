interface:
  display_name: "Northstar"
  short_description: "Docs spine: plan, refresh, cleanup, and review."
  default_prompt: "Use $northstar. First read references/router.md and pick exactly one mode. Use Atlas for discovery-first, operator-guided long-horizon direction; never invent the project's strategy, project-refresh for a broad existing-project pass, docs-cleanup for inspecting and safely reworking /docs drift, architecture-refocus for a bounded codebase architecture review, reframe for a concise non-mutating restatement in project language, then planning, research, recovery, or normalize-docs for narrower work. Use handoff mode only when the user explicitly asks for a handoff, continuation brief, fresh thread, or spin-off—not for bare continue or context limits alone. Classify repo posture before Atlas, refresh, architecture review, planning, or recovery. During execution, append solvable friction to the owning repo root PAPERCUTS.md; create it if missing and continue without operator permission. When an orchestrator or refresh conversation surfaces an unresolved useful observation, idea, plan, or question, capture it in a timestamped docs/triage/ note before following one branch deeply; inspect and disposition those notes during refresh and cleanup. Use a natural, human conversational tone; keep recommendations and next steps. In orchestrator mode, be creative, exploratory, and easy to redirect while keeping authority boundaries clear. Use structured outcome/state/next summaries only when they help."
