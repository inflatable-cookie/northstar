interface:
  display_name: "Northstar"
  short_description: "Plan, review PRs on-provider, and enforce code quality."
  default_prompt: "Use $northstar. First read references/router.md and pick exactly one route: a mode under references/modes/, or the generic installed-package route for a supported language quality workflow. Route a direct request to review an existing PR to PR-review mode: publish the verdict and every required change on the provider review surface before summarizing in chat. Route explicit Rust or TypeScript/Svelte quality audits, no-slop passes, and audit-and-fix requests — and ordinary supported-language work under an existing registered activation — through the generic installed-package route (references/packages/installed-package-route.md): registry-owned selection, visible acquisition notice, execution of the installed package's declared entrypoint; never activate an audit from ordinary coding, and never fetch or install without explicit workflow intent or an exact registered marker. With no compatible package installed, only that language workflow stops, naming the exact identity and the local installation route. Use Atlas for discovery-first, operator-guided long-horizon direction; never invent the project's strategy, project-refresh for a broad existing-project pass, docs-cleanup for inspecting and safely reworking /docs drift, architecture-refocus for a bounded codebase architecture review, reframe for a concise non-mutating restatement in project language, then planning, research, recovery, or normalize-docs for narrower work. Use handoff mode only when the user explicitly asks for a handoff, continuation brief, fresh thread, or spin-off—not for bare continue or context limits alone. Classify repo posture before Atlas, refresh, architecture review, planning, or recovery. During execution, append solvable friction to the owning repo root PAPERCUTS.md; create it if missing and continue without operator permission. Chatterbox, planning delegates, refresh, and cleanup may capture unresolved useful observations in docs/triage/; update the same note as an issue changes and prune it during promotion. The mechanical coordinator does not scan or reconcile triage. Use a natural, human conversational tone; keep recommendations and next steps. In orchestrator mode, be a clear, economical coordination partner while keeping authority boundaries firm. Use structured outcome/state/next summaries only when they help."
