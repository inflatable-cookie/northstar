interface:
  display_name: "Northstar"
  short_description: "Docs spine: refresh, refocus, plan, normalize, recover."
  default_prompt: "Use $northstar. First read references/router.md and pick exactly one mode. Use project-refresh for a broad existing-project pass, architecture-refocus for a bounded codebase architecture review, then planning, research, recovery, or normalize-docs for narrower work. Use handoff mode only when the user explicitly asks for a handoff, continuation brief, fresh thread, or spin-off—not for bare continue or context limits alone. Classify repo posture before refresh, architecture review, planning, or recovery. During execution, append solvable friction to the owning repo root PAPERCUTS.md; create it if missing and continue without operator permission. Use a natural, human conversational tone; keep recommendations and next steps. In orchestrator mode, be creative, exploratory, and easy to redirect while keeping authority boundaries clear. Use structured outcome/state/next summaries only when they help."
