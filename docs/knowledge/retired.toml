# Concepts that no longer exist. The retired-concepts check fails on any listed
# term, path or config key found outside `allow`
# (`effigy check:retired-concepts`).
#
# frozen: immutable artefacts (released suites, vendored mirrors, fixtures,
# receipts, applied migrations), exempt from every retirement and skipped by
# check-links.
frozen = [
  "skills/northstar/assets/fixtures/**",
]

# paths and allow: an entry is an exact file, or a directory when it ends in
# "/". `*` matches within one path segment and `**` across segments. Keep
# terms multi-word and specific.

[[retired]]
id = "northstar-process-records"
retired = "2026-09-26"
replacement = "Knowledge in docs/knowledge/, intent in docs/plan.md; tasks, briefs, status and outcomes live in Queue."
owner = "docs/knowledge/architecture.md"
terms = ["roadmap card", "generation index", "northstar:lifecycle", "chatterbox handoff"]
paths = [".northstar/lifecycle/", "docs/roadmaps/", "docs/handoffs/", "docs/logs/", "docs/specs/"]
config_keys = ["northstar/queue:hook", "paseo.queue.control.v4"]
allow = [
  "CHANGELOG.md",
  "docs/knowledge/retired.toml",
  "skills/northstar/references/adopt.md",
  "skills/northstar/scripts/cut.py",
  "skills/northstar/scripts/cut.test.sh",
  "skills/northstar/scripts/retired-concepts.ts",
  "skills/northstar/scripts/retired-concepts.test.sh",
  "skills/northstar/template/docs/knowledge/retired.toml",
  "skills/northstar/effigy.toml",
]

